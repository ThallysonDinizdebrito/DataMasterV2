bundle:
  name: datamasterv2-delivery-lakeflow-v2

variables:
  catalog:
    description: Unity Catalog catalog name
    default: delivery_datamaster

             
  schema:
    description: Target schema for the DLT pipeline
    default: default

  source_path:
    description: Event Hub Capture AVRO source path
    default: abfss://source@stdmv2devvxc02.dfs.core.windows.net/eventhub-capture

  azure_tenant_id:
    description: Azure tenant ID used by the Azure Cost Management ingestion job
    default: 1d1e1d50-bb96-44f7-81ad-10c6e41d1e6d

  azure_client_id:
    description: Azure client ID used by the Azure Cost Management ingestion job
    default: 7da295f3-e9d6-4a72-9f47-8e3bde7fcc92

  azure_subscription_id:
    description: Azure subscription ID used by the Azure Cost Management ingestion job
    default: 97eb265c-59ce-4122-bbe4-98f0d58d9208

  cost_schema:
    description: Target schema for Azure cost observability tables
    default: observability

  cost_secret_scope:
    description: Databricks secret scope containing the Azure client secret (backed by Azure Key Vault)
    default: kv-backed

  cost_secret_key:
    description: Databricks secret key containing the Azure client secret
    default: azure-client-secret

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405608830882565.5.azuredatabricks.net/
    variables:
      catalog: delivery_datamaster
      schema: default
      source_path: abfss://source@stdmv2devvxc02.dfs.core.windows.net/eventhub-capture
      azure_tenant_id: 1d1e1d50-bb96-44f7-81ad-10c6e41d1e6d
      azure_client_id: 7da295f3-e9d6-4a72-9f47-8e3bde7fcc92
      azure_subscription_id: 97eb265c-59ce-4122-bbe4-98f0d58d9208
      cost_schema: observability
      cost_secret_scope: dmv2-dev
      cost_secret_key: azure-client-secret

resources:
  pipelines:
    delivery_eventhub_medallion_v2:
      name: dlt-dmv2-delivery-eventhub-dev
      catalog: ${var.catalog}
      target: ${var.schema}
      development: true
      continuous: false
      photon: true
      channel: CURRENT
      clusters:
        - label: default
          node_type_id: Standard_D4s_v3
          driver_node_type_id: Standard_D4s_v3
          num_workers: 1

      configuration:
        source_path: ${var.source_path}
        catalog_name: ${var.catalog}
        schema_name: ${var.schema}
        dq_rules_path: ${workspace.file_path}/data_quality/rules.py


      libraries:
        - file:
            path: ./bronze/bronze_eventhub_capture.py
        - file:
            path: ./silver/silver_delivery_entities.py
        - file:
            path: ./gold/gold_delivery_metrics.py

  jobs:
    azure_cost_observability:
      name: job-dmv2-azure-cost-observability
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      tasks:
        - task_key: ingest_azure_costs
          notebook_task:
            notebook_path: ./observability/azure_cost_ingestion.py
            base_parameters:
              tenant_id: ${var.azure_tenant_id}
              client_id: ${var.azure_client_id}
              subscription_id: ${var.azure_subscription_id}
              catalog: ${var.catalog}
              schema: ${var.cost_schema}
              secret_scope: ${var.cost_secret_scope}
              secret_key: ${var.cost_secret_key}
              lookback_days: "30"
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4s_v3
            driver_node_type_id: Standard_D4s_v3
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode

    delta_table_maintenance:
      name: job-dmv2-delta-table-maintenance
      tasks:
        - task_key: optimize_and_vacuum
          notebook_task:
            notebook_path: ./maintenance/delta_maintenance.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              retention_hours: "168"
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4s_v3
            driver_node_type_id: Standard_D4s_v3
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode

    apply_governance:
      name: job-dmv2-apply-governance
      tasks:
        - task_key: apply_unity_catalog_governance
          notebook_task:
            notebook_path: ./governance/apply_governance.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              governance_schema: governance
              data_engineer_group: data-engineers
              data_analyst_group: data-analysts
              data_scientist_group: data-scientists
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4s_v3
            driver_node_type_id: Standard_D4s_v3
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
