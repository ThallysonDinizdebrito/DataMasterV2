name: Deploy Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: 1.9.8
  AZURE_FUNCTIONAPP_NAME: func-dmv2-dev-generator
  AZURE_RESOURCE_GROUP: rg-dmv2-dev
  TFSTATE_RESOURCE_GROUP: rg-datamasterv2-tfstate-dev
  TFSTATE_LOCATION: brazilsouth
  TFSTATE_STORAGE_ACCOUNT: stdmv2tfstatedev
  TFSTATE_CONTAINER: tfstate
  FUNCTION_PROJECT_PATH: azure_function/GeracaoData
  DATABRICKS_HOST: https://adb-7405608830882565.5.azuredatabricks.net/

jobs:

  # ============================================================
  # JOB 1: Cria backend remoto para o tfstate
  # ============================================================
  setup-tf-backend:
    name: Setup Terraform Backend
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Create Terraform Backend Resource Group
        run: |
          if ! az group show --name ${{ env.TFSTATE_RESOURCE_GROUP }} &>/dev/null; then
            az group create \
              --name ${{ env.TFSTATE_RESOURCE_GROUP }} \
              --location ${{ env.TFSTATE_LOCATION }}
          else
            echo "Terraform backend resource group already exists."
          fi

      - name: Create Terraform Backend Storage Account
        run: |
          if ! az storage account show \
            --name ${{ env.TFSTATE_STORAGE_ACCOUNT }} \
            --resource-group ${{ env.TFSTATE_RESOURCE_GROUP }} &>/dev/null; then
            az storage account create \
              --name ${{ env.TFSTATE_STORAGE_ACCOUNT }} \
              --resource-group ${{ env.TFSTATE_RESOURCE_GROUP }} \
              --location ${{ env.TFSTATE_LOCATION }} \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          else
            echo "Terraform backend storage account already exists."
          fi

      - name: Create Terraform Backend Container
        run: |
          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group ${{ env.TFSTATE_RESOURCE_GROUP }} \
            --account-name ${{ env.TFSTATE_STORAGE_ACCOUNT }} \
            --query '[0].value' \
            -o tsv)

          az storage container create \
            --name ${{ env.TFSTATE_CONTAINER }} \
            --account-name ${{ env.TFSTATE_STORAGE_ACCOUNT }} \
            --account-key "$ACCOUNT_KEY"

  # ============================================================
  # JOB 2: Terraform Apply
  # ============================================================
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: dev
    needs: setup-tf-backend

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_project_name: DataMasterV2
      TF_VAR_environment: dev
      TF_VAR_location: brazilsouth
      TF_VAR_enable_function_app: true
      TF_VAR_function_location: westeurope
      TF_VAR_enable_unity_catalog: false
      TF_VAR_unity_catalog_metastore_id: ""
      TF_VAR_function_schedule: "0 */1 * * * *"
      TF_VAR_fake_num_clientes: 1
      TF_VAR_fake_num_restaurantes: 1
      TF_VAR_fake_num_drivers: 1
      TF_VAR_fake_num_items_per_restaurante: 8
      TF_VAR_fake_num_pedidos: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      # - name: Terraform Format Check
      #   working-directory: infra
      #   run: terraform fmt -check -recursive

      # - name: Terraform Validate
      #   working-directory: infra
      #   run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Export Terraform Outputs
        working-directory: infra
        run: terraform output

  # ============================================================
  # JOB 3: Deploy Azure Function
  # ============================================================
  function:
    name: Publish Azure Function
    runs-on: ubuntu-latest
    environment: dev
    needs: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python Function Syntax
        run: python -m py_compile ${{ env.FUNCTION_PROJECT_PATH }}/gerarFakeData/__init__.py

      - name: Publish Function App via func CLI
        working-directory: ${{ env.FUNCTION_PROJECT_PATH }}
        run: func azure functionapp publish ${{ env.AZURE_FUNCTIONAPP_NAME }} --build remote --python

      - name: Restart Function App
        run: |
          az functionapp restart \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Validate Published Function Trigger
        run: |
          az functionapp function list \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --query "[].{name:name,trigger:config.bindings[0].type}" \
            -o table

  # ============================================================
  # JOB 4: Deploy Databricks Lakeflow.
  # CORRECAO: usa DATABRICKS_TOKEN (PAT) — removido azure-cli
  # ============================================================
  databricks:
    name: Deploy Databricks Lakeflow
    runs-on: ubuntu-latest
    environment: dev
    needs: terraform

    env:
      DATABRICKS_HOST: https://adb-7405608830882565.5.azuredatabricks.net/
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_storage_account_key: ${{ secrets.STORAGE_ACCOUNT_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Setup Terraform for Databricks Bundle
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Databricks Authentication
        run: |
          databricks auth describe
          databricks current-user me

      - name: Validate Databricks Bundle
        working-directory: lakeflow
        run: databricks bundle validate -t dev

      - name: Deploy Databricks Bundle
        working-directory: lakeflow
        run: databricks bundle deploy -t dev

      - name: Bundle Deploy Summary
        working-directory: lakeflow
        run: databricks bundle summary -t dev

      - name: Start Databricks DLT Pipeline
        working-directory: lakeflow
        run: databricks bundle run delivery_eventhub_medallion_v2 -t dev


# ============================================================
  # JOB 5: Validação pós-run das tabelas Bronze/Silver/Gold
  # ============================================================
  validate-pipeline:
    name: Validate Pipeline Tables
    runs-on: ubuntu-latest
    environment: dev
    needs: databricks

    env:
      DATABRICKS_HOST: https://adb-7405608830882565.5.azuredatabricks.net/
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      WAREHOUSE_ID: cd1e00488549c535
      CATALOG: dbw_dmv2_dev_7405608830882565
      SCHEMA: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bronze Tables
        run: |
          FAILED=0

          for TABLE in bronze_delivery_batches bronze_eventhub_capture_raw; do
            echo "🔍 Checking $TABLE..."
            RESULT=$(databricks sql execute \
              --warehouse-id $WAREHOUSE_ID \
              --wait-timeout 60s \
              --statement "SELECT COUNT(*) as total FROM $CATALOG.$SCHEMA.$TABLE" 2>&1)

            echo "$RESULT"

            COUNT=$(echo "$RESULT" | grep -oP '"total",\s*"\K[0-9]+' || echo "0")

            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
              echo "❌ $TABLE is EMPTY or failed!"
              echo "BRONZE_${TABLE}=FAIL" >> $GITHUB_ENV
              FAILED=1
            else
              echo "✅ $TABLE has $COUNT rows."
              echo "BRONZE_${TABLE}=OK ($COUNT rows)" >> $GITHUB_ENV
            fi
          done

          [ $FAILED -eq 1 ] && exit 1 || echo "✅ All Bronze tables OK."

      - name: Validate Silver Tables
        run: |
          FAILED=0

          for TABLE in silver_clientes silver_drivers silver_items silver_order_items silver_orders silver_restaurantes; do
            echo "🔍 Checking $TABLE..."
            RESULT=$(databricks sql execute \
              --warehouse-id $WAREHOUSE_ID \
              --wait-timeout 60s \
              --statement "SELECT COUNT(*) as total FROM $CATALOG.$SCHEMA.$TABLE" 2>&1)

            echo "$RESULT"

            COUNT=$(echo "$RESULT" | grep -oP '"total",\s*"\K[0-9]+' || echo "0")

            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
              echo "❌ $TABLE is EMPTY or failed!"
              echo "SILVER_${TABLE}=FAIL" >> $GITHUB_ENV
              FAILED=1
            else
              echo "✅ $TABLE has $COUNT rows."
              echo "SILVER_${TABLE}=OK ($COUNT rows)" >> $GITHUB_ENV
            fi
          done

          [ $FAILED -eq 1 ] && exit 1 || echo "✅ All Silver tables OK."

      - name: Validate Gold Tables
        run: |
          FAILED=0

          for TABLE in gold_daily_delivery_kpis gold_item_category_metrics gold_restaurant_performance; do
            echo "🔍 Checking $TABLE..."
            RESULT=$(databricks sql execute \
              --warehouse-id $WAREHOUSE_ID \
              --wait-timeout 60s \
              --statement "SELECT COUNT(*) as total FROM $CATALOG.$SCHEMA.$TABLE" 2>&1)

            echo "$RESULT"

            COUNT=$(echo "$RESULT" | grep -oP '"total",\s*"\K[0-9]+' || echo "0")

            if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
              echo "❌ $TABLE is EMPTY or failed!"
              echo "GOLD_${TABLE}=FAIL" >> $GITHUB_ENV
              FAILED=1
            else
              echo "✅ $TABLE has $COUNT rows."
              echo "GOLD_${TABLE}=OK ($COUNT rows)" >> $GITHUB_ENV
            fi
          done

          [ $FAILED -eq 1 ] && exit 1 || echo "✅ All Gold tables OK."

      - name: Summary Report
        if: always()
        run: |
          echo "## 📊 Validação das Tabelas Pós-Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🥉 Bronze" >> $GITHUB_STEP_SUMMARY
          echo "| Tabela | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| bronze_delivery_batches | ${BRONZE_bronze_delivery_batches:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY
          echo "| bronze_eventhub_capture_raw | ${BRONZE_bronze_eventhub_capture_raw:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🥈 Silver" >> $GITHUB_STEP_SUMMARY
          echo "| Tabela | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| silver_clientes | ${SILVER_silver_clientes:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY
          echo "| silver_drivers | ${SILVER_silver_drivers:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY
          echo "| silver_items | ${SILVER_silver_items:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY
          echo "| silver_order_items | ${SILVER_silver_order_items:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY
          echo "| silver_orders | ${SILVER_silver_orders:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY
          echo "| silver_restaurantes | ${SILVER_silver_restaurantes:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🥇 Gold" >> $GITHUB_STEP_SUMMARY
          echo "| Tabela | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| gold_daily_delivery_kpis | ${GOLD_gold_daily_delivery_kpis:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY
          echo "| gold_item_category_metrics | ${GOLD_gold_item_category_metrics:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY
          echo "| gold_restaurant_performance | ${GOLD_gold_restaurant_performance:-❌ FAIL} |" >> $GITHUB_STEP_SUMMARY